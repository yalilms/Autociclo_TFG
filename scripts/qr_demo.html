<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AutoCiclo — Etiquetas QR para Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; }
    h1 { color: #1e3a5f; text-align: center; }
    .seccion { margin: 30px 0 10px; font-size: 18px; font-weight: bold; color: #2563eb; border-bottom: 2px solid #2563eb; padding-bottom: 4px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; }
    .etiqueta {
      background: white; border: 1px solid #ddd; border-radius: 8px;
      padding: 12px; text-align: center; page-break-inside: avoid;
    }
    .etiqueta canvas { display: block; margin: 0 auto 8px; }
    .codigo { font-family: monospace; font-size: 11px; color: #333; font-weight: bold; }
    .nombre { font-size: 12px; color: #666; margin-top: 4px; }
    .tipo-badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 10px; font-weight: bold; margin-top: 4px;
    }
    .pieza  { background: #dbeafe; color: #1e40af; }
    .vehiculo { background: #dcfce7; color: #166534; }
    @media print {
      body { background: white; padding: 0; }
      h1, .seccion { color: black; }
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
    .btn { display: block; margin: 0 auto 20px; padding: 12px 32px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>🔧 AutoCiclo — Etiquetas QR para Demo</h1>
  <button class="btn" onclick="window.print()">🖨️ Imprimir etiquetas</button>

  <div class="seccion">Piezas (QR-PIE-00001 a QR-PIE-00012)</div>
  <div class="grid" id="grid-piezas"></div>

  <div class="seccion">Vehículos (QR-VEH-00003 a QR-VEH-00007)</div>
  <div class="grid" id="grid-vehiculos"></div>

  <script>
    const piezas = [
      { codigo: 'QR-PIE-00001', nombre: 'Motor 1.6 TDI'              },
      { codigo: 'QR-PIE-00002', nombre: 'Motor 2.0 HDI'              },
      { codigo: 'QR-PIE-00003', nombre: 'Puerta delantera izq.'      },
      { codigo: 'QR-PIE-00004', nombre: 'Capó delantero'             },
      { codigo: 'QR-PIE-00005', nombre: 'Parachoques trasero'        },
      { codigo: 'QR-PIE-00006', nombre: 'Volante multifunción'       },
      { codigo: 'QR-PIE-00007', nombre: 'Asientos delanteros'        },
      { codigo: 'QR-PIE-00008', nombre: 'Faro delantero LED'         },
      { codigo: 'QR-PIE-00009', nombre: 'Alternador 120A'            },
      { codigo: 'QR-PIE-00010', nombre: 'Disco de freno 280mm'       },
      { codigo: 'QR-PIE-00011', nombre: 'Neumático 205/55 R16'       },
      { codigo: 'QR-PIE-00012', nombre: 'Turbocompresor'             },
    ];

    const vehiculos = [
      { codigo: 'QR-VEH-00003', nombre: 'Renault Clio 2012 · 9012GHI'   },
      { codigo: 'QR-VEH-00004', nombre: 'Ford Focus 2016 · 3456JKL'      },
      { codigo: 'QR-VEH-00005', nombre: 'Honda CBR 2019 · 7890MNO'       },
      { codigo: 'QR-VEH-00006', nombre: 'Toyota Corolla 2017 · 2345PQR'  },
      { codigo: 'QR-VEH-00007', nombre: 'Peugeot 308 2014 · 6789STU'     },
    ];

    function generarEtiquetas(items, containerId, tipo) {
      const container = document.getElementById(containerId);
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'etiqueta';
        const canvas = document.createElement('canvas');
        div.innerHTML = `
          <div class="codigo">${item.codigo}</div>
          <div class="nombre">${item.nombre}</div>
          <span class="tipo-badge ${tipo}">${tipo === 'pieza' ? '🔧 PIEZA' : '🚗 VEHÍCULO'}</span>
        `;
        div.prepend(canvas);
        container.appendChild(div);
        QRCode.toCanvas(canvas, item.codigo, { width: 120, margin: 1 }, err => {
          if (err) console.error(err);
        });
      });
    }

    generarEtiquetas(piezas,    'grid-piezas',    'pieza');
    generarEtiquetas(vehiculos, 'grid-vehiculos', 'vehiculo');
  </script>
</body>
</html>
