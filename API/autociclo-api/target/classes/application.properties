# ============================================================
# AUTOCICLO API — Configuración principal
# Servidor: Ubuntu Server IONOS (8 GB RAM / 256 GB SSD)
# ============================================================

# ── Servidor ──────────────────────────────────────────────
server.port=8080

# ── Base de datos MySQL (Ubuntu Server IONOS) ─────────────
# Usa variables de entorno en producción: DB_HOST, DB_USER, DB_PASS
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/autociclo_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:autociclo}
spring.datasource.password=${DB_PASS:autociclo1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ───────────────────────────────────────
# validate: verifica que las entidades coinciden con el esquema existente
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Respetar nombres exactos de @Table (evita que SpringPhysicalNamingStrategy
# convierta CLIENTES → clientes en MySQL case-sensitive de Linux)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ── JWT ───────────────────────────────────────────────────
# Cambiar JWT_SECRET en producción con variable de entorno
app.jwt.secret=${JWT_SECRET:autociclo-secret-key-minimo-32-caracteres-cambiar}
# 24 horas en milisegundos
app.jwt.expiration=86400000

# ── CORS ──────────────────────────────────────────────────
# Orígenes permitidos (añadir IP del servidor IONOS en producción)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ── Logging ───────────────────────────────────────────────
logging.level.com.autociclo=INFO
logging.level.org.springframework.security=WARN
