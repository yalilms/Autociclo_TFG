plugins {
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.1.0' //Plugin que ayuda a construir proyectos JAVAFX
}

repositories {
	mavenCentral()
}

javafx {
    version = "21.0.5"
    modules = [ 'javafx.base', 'javafx.graphics', 'javafx.controls', 'javafx.fxml', 'javafx.media']
}

dependencies {
  // Driver MySQL
    implementation 'com.mysql:mysql-connector-j:8.2.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // Ikonli
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.3.1'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // RabbitMQ AMQP client
    implementation 'com.rabbitmq:amqp-client:5.20.0'

    // JavaFX para Windows (necesario para el instalador Windows)
    runtimeOnly 'org.openjfx:javafx-base:21.0.5:win'
    runtimeOnly 'org.openjfx:javafx-graphics:21.0.5:win'
    runtimeOnly 'org.openjfx:javafx-controls:21.0.5:win'
    runtimeOnly 'org.openjfx:javafx-fxml:21.0.5:win'
    runtimeOnly 'org.openjfx:javafx-media:21.0.5:win'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.autociclo.Main'
    applicationDefaultJvmArgs = []
}

sourceSets {
  main {
    resources {
        srcDirs = ["src/main/resources"]
        includes = ["**/*.fxml","**/*.png","**/*.properties","**/*.css","**/*.jpg","**/*.jpeg","**/*.json"]
    }
  }
}

// Configurar el JAR ejecutable
jar {
    manifest {
        attributes(
            'Main-Class': 'com.autociclo.Main',
            'Class-Path': configurations.runtimeClasspath.files.collect { 'lib/' + it.name }.join(' ')
        )
    }
    archiveBaseName = 'AutoCiclo'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Directorio raíz de instaladores
def instaladoresDir = file('../Instaladores')
instaladoresDir.mkdirs()

// ─────────────────────────────────────────────────────────
// Paso previo: compila el JAR y copia dependencias
// ─────────────────────────────────────────────────────────
task regenerarCarpetaInstalacion {
    group = 'distribution'
    description = 'Compila el JAR y prepara la carpeta de entrada para jpackage'
    dependsOn jar

    doLast {
        def instalacionDir = file('../Instaladores/CarpetaInstalacion')
        instalacionDir.mkdirs()

        // Limpiar contenido previo
        instalacionDir.listFiles()?.each { f ->
            if (f.name != 'run.sh' && f.name != 'run.bat' && f.name != 'iconos') f.deleteDir() ?: f.delete()
        }

        // JAR principal
        copy {
            from jar.archiveFile
            into instalacionDir
            rename { 'AutoCiclo.jar' }
        }

        // Dependencias en lib/ (excluir JARs nativos de otras plataformas)
        copy {
            from configurations.runtimeClasspath
            into new File(instalacionDir, 'lib')
            exclude '**/*-win.jar'
            exclude '**/*-mac.jar'
        }

        def licenseFile = new File(instalacionDir, 'LICENSE.txt')
        if (!licenseFile.exists()) {
            licenseFile.text = "AutoCiclo - Sistema de Gestión de Desguace\nCopyright (c) 2026 Yalil Musa Talhaoui. Todos los derechos reservados.\n"
        }

        println "Carpeta de instalación lista en: ${instalacionDir.absolutePath}"
    }
}

// ─────────────────────────────────────────────────────────
// INSTALADOR UBUNTU — .deb con JRE embebido
// Requiere: dpkg, fakeroot (sudo dnf install dpkg fakeroot)
// Genera:   ../Instaladores/autociclo_1.0.0_amd64.deb
// ─────────────────────────────────────────────────────────
task instaladorUbuntu(type: Exec) {
    group = 'distribution'
    description = 'Genera autociclo_1.0.0_amd64.deb con JRE 21 embebido (sin necesitar Java instalado)'
    dependsOn regenerarCarpetaInstalacion

    def inputDir  = file('../Instaladores/CarpetaInstalacion').absolutePath
    def outputDir = file('../Instaladores').absolutePath
    def icon      = file('src/main/resources/imagenes/logo_autociclo.png').absolutePath

    doFirst {
        fileTree('../Instaladores').matching { include 'autociclo*.deb' }.each { it.delete() }
        println "Generando instalador .deb para Ubuntu/Debian..."
    }

    commandLine 'jpackage',
        '--type',           'deb',
        '--input',          inputDir,
        '--main-jar',       'AutoCiclo.jar',
        '--main-class',     'com.autociclo.Main',
        '--name',           'autociclo',
        '--app-version',    '1.0.0',
        '--vendor',         'Yalil Musa Talhaoui',
        '--description',    'Sistema de gestión multiplataforma para desguace de vehículos',
        '--copyright',      'Copyright (c) 2026 Yalil Musa Talhaoui',
        '--icon',           icon,
        '--dest',           outputDir,
        '--linux-app-category', 'Utility',
        '--linux-shortcut',
        '--java-options',   '--module-path $APPDIR/lib',
        '--java-options',   '--add-modules=javafx.base,javafx.graphics,javafx.controls,javafx.fxml,javafx.media',
        '--java-options',   '-Dfile.encoding=UTF-8'

    doLast {
        def deb = fileTree('../Instaladores').matching { include 'autociclo*.deb' }.singleFile
        println "\nInstalador Ubuntu listo: ${deb.absolutePath}"
        println "Tamaño: ${(deb.length() / 1_048_576).round(1)} MB"
        println "Instalar en Ubuntu con:  sudo dpkg -i ${deb.name}"
    }
}

// ─────────────────────────────────────────────────────────
// INSTALADOR FEDORA — .rpm con JRE embebido
// Requiere: rpm-build (sudo dnf install rpm-build)
// Genera:   ../Instaladores/autociclo-1.0.0-1.x86_64.rpm
// ─────────────────────────────────────────────────────────
task instaladorFedora(type: Exec) {
    group = 'distribution'
    description = 'Genera autociclo-1.0.0.x86_64.rpm con JRE 21 embebido (sin necesitar Java instalado)'
    dependsOn regenerarCarpetaInstalacion

    def inputDir  = file('../Instaladores/CarpetaInstalacion').absolutePath
    def outputDir = file('../Instaladores').absolutePath
    def icon      = file('src/main/resources/imagenes/logo_autociclo.png').absolutePath

    doFirst {
        fileTree('../Instaladores').matching { include 'autociclo*.rpm' }.each { it.delete() }
        println "Generando instalador .rpm para Fedora/RHEL..."
    }

    commandLine 'jpackage',
        '--type',           'rpm',
        '--input',          inputDir,
        '--main-jar',       'AutoCiclo.jar',
        '--main-class',     'com.autociclo.Main',
        '--name',           'autociclo',
        '--app-version',    '1.0.0',
        '--vendor',         'Yalil Musa Talhaoui',
        '--description',    'Sistema de gestión multiplataforma para desguace de vehículos',
        '--copyright',      'Copyright (c) 2026 Yalil Musa Talhaoui',
        '--icon',           icon,
        '--dest',           outputDir,
        '--linux-app-category', 'Utility',
        '--linux-shortcut',
        '--java-options',   '--module-path $APPDIR/lib',
        '--java-options',   '--add-modules=javafx.base,javafx.graphics,javafx.controls,javafx.fxml,javafx.media',
        '--java-options',   '-Dfile.encoding=UTF-8'

    doLast {
        def rpm = fileTree('../Instaladores').matching { include 'autociclo*.rpm' }.singleFile
        println "\nInstalador Fedora listo: ${rpm.absolutePath}"
        println "Tamaño: ${(rpm.length() / 1_048_576).round(1)} MB"
        println "Instalar en Fedora con:  sudo rpm -i ${rpm.name}"
        println "                     o:  sudo dnf install ./${rpm.name}"
    }
}

// ─────────────────────────────────────────────────────────
// INSTALADOR WINDOWS — ZIP portable con JRE 21 embebido
// No requiere herramientas adicionales (descarga JRE de GitHub)
// Genera: ../Instaladores/AutoCiclo-1.0.0-Windows.zip
// ─────────────────────────────────────────────────────────
task portableWindows {
    group = 'distribution'
    description = 'Genera AutoCiclo-1.0.0-Windows.zip con JRE 21 embebido (sin necesitar Java instalado)'
    dependsOn regenerarCarpetaInstalacion

    doLast {
        def baseDir    = file('../Instaladores')
        def winDir     = new File(baseDir, 'AutoCiclo-Windows')
        def jreZipFile = new File(baseDir, 'jre-win.zip')
        def jreDir     = new File(winDir, 'jre')
        def srcDir     = file('../Instaladores/CarpetaInstalacion')

        println "Preparando instalador Windows..."

        // 1 — Preparar directorio limpio
        winDir.deleteDir()
        winDir.mkdirs()
        jreDir.mkdirs()

        // 2 — Copiar JAR y dependencias
        copy {
            from new File(srcDir, 'AutoCiclo.jar')
            into winDir
        }
        copy {
            from configurations.runtimeClasspath
            into new File(winDir, 'lib')
            exclude '**/*-linux.jar'
            exclude '**/*-mac.jar'
        }

        // 3 — Descargar JRE Windows 21 (caché local, solo la primera vez, ~110 MB)
        if (!jreZipFile.exists()) {
            println "Descargando JRE 21 para Windows (~110 MB, solo esta vez)..."
            def url = new URL('https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.7%2B6/OpenJDK21U-jre_x64_windows_hotspot_21.0.7_6.zip')
            jreZipFile.bytes = url.bytes
            println "JRE Windows descargado y cacheado."
        } else {
            println "JRE Windows ya cacheado, reutilizando."
        }

        // 4 — Extraer JRE Windows
        copy {
            from zipTree(jreZipFile)
            into jreDir
            eachFile { fcd ->
                fcd.path = fcd.path.replaceFirst('^[^/]+/', '') // quitar primer nivel de carpeta
            }
            includeEmptyDirs = false
        }

        // 5 — Lanzador .bat
        new File(winDir, 'AutoCiclo.bat').text = """\
@echo off
title AutoCiclo — Sistema de Gestión de Desguace
cd /d "%~dp0"
.\\jre\\bin\\java.exe ^
  --add-modules javafx.base,javafx.graphics,javafx.controls,javafx.fxml,javafx.media ^
  --module-path .\\lib ^
  -Dfile.encoding=UTF-8 ^
  -jar AutoCiclo.jar
if errorlevel 1 pause
"""

        // 6 — README en español
        new File(winDir, 'LEEME.txt').text = """\
AutoCiclo v1.0.0 — Instalación Windows
=======================================
No necesitas instalar Java. El JRE está incluido.

Instrucciones:
  1. Extrae esta carpeta donde quieras.
  2. Haz doble clic en AutoCiclo.bat para ejecutar la aplicación.

Si Windows muestra un aviso de seguridad al ejecutar el .bat,
haz clic en "Más información" y luego "Ejecutar de todas formas".

Desarrollado por Yalil Musa Talhaoui
IES P. Hermenegildo Lanz — 2.° DAM — Granada 2025/26
"""

        // 7 — Comprimir en ZIP
        def zipOut = new File(baseDir, 'AutoCiclo-1.0.0-Windows.zip')
        zipOut.delete()
        ant.zip(destfile: zipOut.absolutePath, basedir: baseDir.absolutePath, includes: 'AutoCiclo-Windows/**')

        // 8 — Limpiar carpeta temporal
        winDir.deleteDir()

        println "\nInstalador Windows listo: ${zipOut.absolutePath}"
        println "Tamaño: ${(zipOut.length() / 1_048_576).round(1)} MB"
        println "Uso: descomprimir y ejecutar AutoCiclo.bat"
    }
}

// ─────────────────────────────────────────────────────────
// TAREA MAESTRA — genera los tres instaladores de una vez
// ─────────────────────────────────────────────────────────
task generarTodosInstaladores {
    group = 'distribution'
    description = 'Genera los instaladores para Ubuntu (.deb), Fedora (.rpm) y Windows (.zip) de una sola vez'
    dependsOn instaladorUbuntu, instaladorFedora, portableWindows

    // Fedora y Ubuntu comparten la carpeta de instalación; los ejecutamos en orden
    instaladorFedora.mustRunAfter instaladorUbuntu

    doLast {
        println "\n================================================"
        println " Todos los instaladores generados:"
        println "================================================"
        fileTree('../Instaladores').matching {
            include '**/*.deb', '**/*.rpm', '**/*.zip'
            exclude '**/jre-win.zip'
        }.each { f ->
            println "  ${f.name}  (${(f.length() / 1_048_576).round(1)} MB)"
        }
        println "================================================"
    }
}
